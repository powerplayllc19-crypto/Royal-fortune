const STRIPE_PRICE_IDS = {
    'pack-starter':     'price_1Sr7DdAjI9V6KtxTRotNZXPA',
    'pack-daily':       'price_1Sr7BzAjI9V6KtxTVkiE428Z',
    'pack-royal':       'price_1Sr7oCAjI9V6KtxTZhdMbBtL',
    'pack-mega':        'price_1SvPNwAjI9V6KtxTpZpiNwexx', 
    'pack-whale':       'prod_TolNxjN3JQiYs3',
    'vip-vipclub':      'price_1Sr797AjI9V6KtxTLd6rjmW7',
    'item-vipxp':       'prod_TolTgDxsCu6SQ3',     // ← update
    'item-autodauber':  'prod_TolVGyaKU7vqTH'      // ← update
};

const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
    }
});

// ────────────────────────────────────────────────
//  Game State (optimistic UI – truth comes from Supabase)
// ────────────────────────────────────────────────
let gameState = {
    balance: 1000.00,
    slotBet: 10,
    nmSlotBet: 5,
    vipSlotBet: 50,
    blackjackBet: 25,
    pokerBet: 5,
    rouletteChip: 10,
    rouletteBets: [],
    freeSpins: 3,
    dailyStreak: 1,
    lastClaim: null,
    vipClub: { active: false, expiresAt: 0, startedAt: 0, adFree: false },
    vipLevel: 0,
    vipXP: 0,
    totalWagered: 0,
    purchases: { bingoAutoDauberUntil: 0 },
    checkout: { type: null, id: null },
    session: null,
    currentUser: null,
    lastRegenAt: Date.now(),
    pendingRef: null
};

// ────────────────────────────────────────────────
//  Core Helpers
// ────────────────────────────────────────────────
function updateBalance(delta) {
    gameState.balance = Math.max(0, gameState.balance + Number(delta));
    document.getElementById('balance').textContent = gameState.balance.toFixed(2);
    queueProfileSync();
}

function addWager(amount) {
    gameState.totalWagered += Number(amount);
    gameState.vipXP += Number(amount);
    updateVipUI();
    queueProfileSync();
}

let syncTimeout = null;
function queueProfileSync() {
    clearTimeout(syncTimeout);
    syncTimeout = setTimeout(syncProfileToSupabase, 1200);
}

async function syncProfileToSupabase() {
    if (!gameState.session?.user?.id) return;

    const uid = gameState.session.user.id;
    const payload = {
        id: uid,
        username: gameState.currentUser?.username || null,
        email: gameState.session.user.email || null,
        coins: Math.floor(gameState.balance),
        vip_level: gameState.vipLevel,
        vip_xp: Math.floor(gameState.vipXP),
        total_wagered: Math.floor(gameState.totalWagered),
        vip_active: isVipClubActive(),
        vip_expires_at: gameState.vipClub.expiresAt ? new Date(gameState.vipClub.expiresAt).toISOString() : null,
        ad_free: !!gameState.vipClub.adFree,
        last_claim: gameState.lastClaim || null,
        daily_streak: gameState.dailyStreak || 1,
        free_spins: gameState.freeSpins || 0,
        updated_at: new Date().toISOString()
    };

    const { error } = await supabase
        .from('profiles')
        .upsert(payload, { onConflict: 'id' });

    if (error) console.warn('Profile sync failed:', error.message);
}

// ────────────────────────────────────────────────
//  Auth & Profile Loading
// ────────────────────────────────────────────────
async function initAuthAndProfile() {
    const { data: { session } } = await supabase.auth.getSession();
    gameState.session = session;

    supabase.auth.onAuthStateChange(async (_, newSession) => {
        gameState.session = newSession;
        if (newSession?.user?.id) {
            await loadProfileFromSupabase(newSession.user.id);
            await applyReferralIfEligible();
        } else {
            gameState.currentUser = null;
            updateAuthUI();
            refreshVipClubUI();
        }
    });

    if (session?.user?.id) {
        await loadProfileFromSupabase(session.user.id);
        await applyReferralIfEligible();
    }
}

async function loadProfileFromSupabase(uid) {
    const { data, error } = await supabase
        .from('profiles')
        .select('*')
        .eq('id', uid)
        .single();

    if (error || !data) {
        console.warn('Could not load profile:', error?.message);
        return;
    }

    // Server → client state
    gameState.balance       = Number(data.coins ?? 1000);
    gameState.vipLevel      = data.vip_level ?? 0;
    gameState.vipXP         = data.vip_xp ?? 0;
    gameState.totalWagered  = data.total_wagered ?? 0;
    gameState.dailyStreak   = data.daily_streak ?? 1;
    gameState.lastClaim     = data.last_claim ?? null;
    gameState.freeSpins     = data.free_spins ?? 3;

    if (data.vip_active && data.vip_expires_at) {
        const exp = new Date(data.vip_expires_at).getTime();
        gameState.vipClub.active   = Date.now() < exp;
        gameState.vipClub.expiresAt = exp;
        gameState.vipClub.adFree   = !!data.ad_free;
    }

    if (data.username) {
        gameState.currentUser = { username: data.username, email: data.email || null };
    }

    document.getElementById('balance').textContent = gameState.balance.toFixed(2);
    updateVipUI();
    updateAuthUI();
    refreshVipClubUI();
    updateDailyBonusUI();
}

// ────────────────────────────────────────────────
//  Stripe Checkout – Live only
// ────────────────────────────────────────────────
async function startCheckout(type, id) {
    if (!gameState.session?.user?.id) {
        showNotification('Please sign in to make a purchase', 'error');
        toggleAuthPanel();
        return;
    }

    const priceKey = `${type}-${id}`;
    const priceId = STRIPE_PRICE_IDS[priceKey];

    if (!priceId || !priceId.startsWith('price_')) {
        showNotification('Product configuration error. Contact support.', 'error');
        return;
    }

    try {
        const { data, error } = await supabase.functions.invoke('create-checkout-session', {
            body: {
                priceId,
                userId: gameState.session.user.id,
                productType: type,
                successUrl: window.location.origin + window.location.pathname + '?success=1',
                cancelUrl:  window.location.origin + window.location.pathname + '?cancel=1'
            }
        });

        if (error) throw error;
        if (data?.url) {
            window.location.href = data.url;
        } else {
            throw new Error('No checkout URL received');
        }
    } catch (err) {
        console.error('Checkout initiation failed:', err);
        showNotification('Unable to start checkout. Please try again later.', 'error');
    }
}

// ────────────────────────────────────────────────
//  Daily Bonus – optimistic + server sync
// ────────────────────────────────────────────────
async function claimDailyBonus() {
    const today = new Date().toDateString();
    if (gameState.lastClaim === today) {
        showNotification('You have already claimed today’s bonus.', 'info');
        return;
    }

    const multiplier = isVipClubActive() ? 2 : 1;
    const streak = gameState.dailyStreak || 1;
    const bonus = 500 * streak * multiplier;

    // Optimistic UI update
    updateBalance(bonus);
    gameState.lastClaim = today;
    gameState.dailyStreak = (gameState.lastClaim === new Date(Date.now() - 86400000).toDateString())
        ? streak + 1
        : 1;

    showNotification(`Daily bonus claimed: +${bonus.toLocaleString()} coins (Day ${gameState.dailyStreak})`, 'success');

    // Persist to Supabase
    if (gameState.session?.user?.id) {
        await supabase
            .from('profiles')
            .update({
                last_claim: today,
                daily_streak: gameState.dailyStreak,
                coins: Math.floor(gameState.balance)
            })
            .eq('id', gameState.session.user.id);
    }

    updateDailyBonusUI();
}

// ────────────────────────────────────────────────
//  Initialization
// ────────────────────────────────────────────────
async function initializeApp() {
    // Render static elements
    createFortuneWheel();
    newBingoCard();

    // Load auth & profile from Supabase
    await initAuthAndProfile();

    // Handle Stripe redirect
    const params = new URLSearchParams(window.location.search);
    if (params.get('success')) {
        showNotification('Thank you! Your purchase has been processed. Your balance will update shortly.', 'success');
        if (gameState.session?.user?.id) {
            await loadProfileFromSupabase(gameState.session.user.id);
        }
        window.history.replaceState({}, '', window.location.pathname);
    }
    if (params.get('cancel')) {
        showNotification('Checkout was canceled.', 'info');
        window.history.replaceState({}, '', window.location.pathname);
    }

    // Start background ticks
    setInterval(coinRegenTick, 1500);
    coinRegenTick();

    // Initial UI updates
    updateVipUI();
    updateAuthUI();
    refreshVipClubUI();
    updateDailyBonusUI();

    console.log('Royal Fortune Casino initialized – live mode');
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initializeApp);
} else {
    initializeApp();
}
</script>
