<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Royal Fortune Casino</title>

<!-- Tailwind -->
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Stripe -->
<script src="https://js.stripe.com/v3/"></script>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto&display=swap" rel="stylesheet">

<style>

body{
background:#0c0c1d;
color:#fff;
font-family:Roboto;
}

.gold{
color:#d4af37;
}

.card{
background:#14142b;
border:1px solid #d4af37;
border-radius:16px;
padding:20px;
}

.btn{
background:linear-gradient(45deg,#d4af37,#f4e4a6);
color:#000;
font-weight:700;
padding:10px 18px;
border-radius:10px;
transition:.2s;
}

.btn:hover{
transform:scale(1.05);
}

</style>

</head>


<body class="p-4 max-w-xl mx-auto">


<!-- ================= HEADER ================= -->

<header class="flex justify-between items-center mb-6">

<h1 class="text-2xl gold font-bold">
👑 Royal Fortune
</h1>

<div class="flex gap-3 items-center">

<div class="card text-sm">
💰 <span id="balance">0</span>
</div>

<button id="authBtn" class="btn">
Sign In
</button>

</div>

</header>


<!-- ================= DAILY ================= -->

<div id="dailyBox" class="card mb-6 hidden text-center">

<h3 class="gold mb-2">🎁 Daily Bonus</h3>

<button onclick="claimDaily()" class="btn w-full">
Claim +500
</button>

</div>


<!-- ================= FEED ================= -->

<div class="card mb-6">

<h3 class="gold mb-2">🔥 Live Wins</h3>

<div id="feed"
class="text-xs space-y-1 h-24 overflow-y-auto"></div>

</div>


<!-- ================= GAME ================= -->

<div class="card mb-6 text-center">

<h2 class="gold mb-4">🎰 Royal Slots</h2>

<div id="slots" class="text-5xl mb-4">
💎 🍒 ⭐
</div>

<div class="mb-2">
Bet: $<span id="bet">10</span>
</div>

<div class="flex justify-center gap-3 mb-4">

<button onclick="changeBet(-5)" class="btn">-</button>
<button onclick="changeBet(5)" class="btn">+</button>

</div>

<button onclick="spin()" class="btn w-full text-xl">
SPIN
</button>

</div>


<!-- ================= STORE ================= -->

<div class="card mb-6">

<h3 class="gold mb-3">💳 Coin Store</h3>

<div class="grid grid-cols-2 gap-3 text-sm">

<button onclick="buyPack('pack-starter')" class="btn">
Starter<br>$0.99
</button>

<button onclick="buyPack('pack-daily')" class="btn">
Daily<br>$2.99
</button>

<button onclick="buyPack('pack-royal')" class="btn">
Royal<br>$6.99
</button>

<button onclick="buyPack('pack-mega')" class="btn">
Mega<br>$14.99
</button>

<button onclick="buyPack('pack-whale')" class="btn col-span-2">
Whale Pack<br>$49.99
</button>

</div>

</div>


<!-- ================= PROFILE ================= -->

<div class="card mb-6">

<h3 class="gold mb-2">📊 Profile</h3>

<div class="text-sm space-y-1">

<div>Level: <span id="level">0</span></div>
<div>XP: <span id="xp">0</span></div>
<div>Wagered: $<span id="wagered">0</span></div>

</div>

</div>


<!-- ================= FOOTER ================= -->

<footer class="text-xs text-gray-400 text-center">

<p>Entertainment only. No real gambling.</p>

</footer>



<!-- ========================================================= -->
<!-- ========================= SCRIPT ======================== -->
<!-- ========================================================= -->

<script>

/* ================= CONFIG ================= */

const SUPABASE_URL =
'https://euvrytzzxeaivpwijekf.supabase.co';

const SUPABASE_ANON_KEY =
'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1dnJ5dHp6eGVhaXZwd2lqZWtmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkwMjYxNjAsImV4cCI6MjA4NDYwMjE2MH0.r5iflXXtIfMNrxHhmze59GR2wEzEEnTH91bdN42FXuA';

const stripe =
Stripe('pk_live_51SmLkWAjI9V6KtxTnZTObyFayrvhXhjT4YhOoOZyUGMjsIaEvFPaefgVJsrZV8GBjl25utF8UfdAuhcTxXKoM2s600yCPER9EH');

const STRIPE_PRICE_IDS = {

'pack-starter':'price_1Sr7DdAjI9V6KtxTRotNZXPA',
'pack-daily':'price_1Sr7BzAjI9V6KtxTVkiE428Z',
'pack-royal':'price_1Sr7oCAjI9V6KtxTZhdMbBtL',
'pack-mega':'price_1SvPNwAjI9V6KtxTpZpiNwexx',

'pack-whale':'prod_TolNxjN3JQiYs3',

'vip-vipclub':'price_1Sr797AjI9V6KtxTLd6rjmW7',

'item-vipxp':'prod_TolTgDxsCu6SQ3',
'item-autodauber':'prod_TolVGyaKU7vqTH'

};


/* ================= INIT ================= */

const supabase =
supabasejs.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);


let state = {

user:null,
balance:0,
xp:0,
wagered:0,
bet:10

};


/* ================= AUTH ================= */

async function initAuth(){

const {data:{session}} =
await supabase.auth.getSession();

if(session){

state.user = session.user;

authBtn.textContent = "Logout";

loadProfile();

}

}


authBtn.onclick = async()=>{

if(state.user){

await supabase.auth.signOut();

location.reload();

}else{

login();

}

};


async function login(){

const email = prompt("Enter email:");

if(!email) return;

await supabase.auth.signInWithOtp({

email,
options:{
emailRedirectTo:location.href
}

});

alert("Check your email");

}


/* ================= PROFILE ================= */

async function loadProfile(){

let {data} =
await supabase
.from("users")
.select("*")
.eq("id",state.user.id)
.single();


if(!data){

await supabase.from("users").insert({

id:state.user.id,
coins:1000,
xp:0,
wagered:0,
last_daily:null

});

return loadProfile();

}


state.balance = data.coins;
state.xp = data.xp;
state.wagered = data.wagered;


updateUI();
checkDaily();

}


/* ================= UI ================= */

function updateUI(){

balance.textContent =
state.balance.toLocaleString();

xp.textContent = state.xp;

wagered.textContent =
state.wagered.toLocaleString();

level.textContent =
Math.floor(state.xp/1000);

bet.textContent = state.bet;

}


/* ================= DAILY ================= */

async function checkDaily(){

const {data} =
await supabase
.from("users")
.select("last_daily")
.eq("id",state.user.id)
.single();


if(
!data.last_daily ||
new Date(data.last_daily)
.toDateString() !==
new Date().toDateString()
){

dailyBox.classList.remove("hidden");

}

}


async function claimDaily(){

await supabase.rpc("claim_daily");

dailyBox.classList.add("hidden");

loadProfile();

notify("Daily bonus claimed!");

}


/* ================= GAME ================= */

function changeBet(v){

state.bet =
Math.max(5,
Math.min(500,state.bet+v));

updateUI();

}


async function spin(){

if(!state.user)
return notify("Login first");


const res = await fetch(

`${SUPABASE_URL}/functions/v1/spin`,

{
method:"POST",
headers:{
Authorization:
`Bearer ${SUPABASE_ANON_KEY}`,
"Content-Type":"application/json"
},
body:JSON.stringify({
bet:state.bet
})
}

);


const data = await res.json();


if(!res.ok)
return notify(data.error);


slots.textContent =
data.symbols.join(" ");


state.balance = data.balance;
state.xp = data.xp;
state.wagered = data.wagered;


if(data.win>0){

notify("WIN +$"+data.win);

pushFeed(data.win);

}


updateUI();

}


/* ================= FEED ================= */

function pushFeed(amount){

const el =
document.createElement("div");

el.textContent =
`🎉 Player won $${amount}`;

feed.prepend(el);

}


/* ================= STORE ================= */

async function buyPack(pack){

if(!state.user)
return notify("Login first");


const priceId =
STRIPE_PRICE_IDS[pack];

if(!priceId)
return notify("Invalid pack");


const res =
await fetch(
`${SUPABASE_URL}/functions/v1/checkout`,
{
method:"POST",
headers:{
Authorization:
`Bearer ${SUPABASE_ANON_KEY}`,
"Content-Type":"application/json"
},
body:JSON.stringify({
priceId
})
}
);


const data = await res.json();


if(!res.ok)
return notify(data.error);


stripe.redirectToCheckout({
sessionId:data.sessionId
});

}


/* ================= UTIL ================= */

function notify(msg){

alert(msg);

}


/* ================= START ================= */

initAuth();

</script>

</body>
</html>
